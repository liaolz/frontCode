<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias</title>
    <style>
        /* 全局重置，保证边距统一 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fa;
            /* 仅用于衬托导航栏，与需求无关 */
            min-height: 100vh;
        }

        /* ----- 第一部分：顶部导航栏 ----- */
        .navbar {
            background-color: #808080;
            /* 灰色背景 (标准灰) */
            color: #1e1e1e;
            padding: 0.75rem 2rem;
            /* 上下内边距0.75rem，左右2rem，舒适呼吸感 */
            /* 弹性布局   一维的布局，默认水平布局，控制空间分布和对齐方式*/
            display: flex;
            /* flex 水平布局 */
            align-items: center;
            /* 垂直居中 */
            justify-content: space-between;
            /* 标题左，超链接右 左右对齐*/
            flex-wrap: nowrap;
            /* 不换行 */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid #6e6e6e;
            /* 增加一点层次 */

        }

        /* 标题区域 — 加粗展示 */
        .navbar-brand {
            font-size: 1.6rem;
            /* 合理放大，突出标题 */
            font-weight: 700;
            /* 加粗 (bold) */
            letter-spacing: 0.02em;
            color: white;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            /* 不加下划线，保持干净 */
            font-family: "楷体";
            /* 设置字体为楷体 */
        }

        /* 退出登录超链接 */
        .navbar-logout {
            font-size: 1.1rem;
            font-weight: 500;
            color: white;
            background-color: rgba(255, 255, 255, 0.25);
            /* 轻微背景点缀，更易识别 */
            padding: 0.3rem 1rem;
            border-radius: 30px;
            /* 圆角胶囊风格 */
            text-decoration: none;
            /* 去除默认下划线 */
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.08);
            white-space: nowrap;
        }

        /* 悬停效果 — 更明显的交互反馈 */
        .navbar-logout:hover {
            background-color: rgba(255, 255, 255, 0.5);
            border-color: #3a3a3a;
            color: #000;
            transform: scale(1.02);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            /* 保持无下划线 */
        }

        /* 第二部分 表单样式 */
        .search-form {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            /* 控件间隔 */
        }

        .search-form input[type="text"],
        .search-form select {
            padding: 5px;
            /* 输入框内边距 */
            width: 300px;
            /* 固定宽度，保持整齐 */
        }

        .search-form button {
            padding: 5px 15px;
            /* 按钮内边距 */
        }

        /* 第三部分 表格样式  */
        table {
            width: 100%;
            border-collapse: collapse;
            /* 合并边框 */
        }

        th,
        td {
            border: 1px solid #dee2e6;
            /* 单元格边框 */
            padding: 14px 18px;
            /* 单元格内边距 */
            text-align: center;
            /* 居中 */
        }

        th {
            /* padding: 14px 12px; */
            /* text-align: center; */
            font-weight: bold;
            /* 表头加粗 */
            background-color: #f2f2f2;
            /* 表头背景颜色 */
        }

        /* td {
            /* padding: 14px 12px; */
        /* border-bottom: 1px solid #f0f0f0; */
        /*color: #1f2937;
            vertical-align: middle;
        } */

        tbody tr:hover {
            background: #f9fafb;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border: 2px solid #e5e7eb;
        }

        .btn-group {
            display: flex;
            /* 默认水平排列 */
            gap: 8px;
            /* 按钮间距 */
            flex-wrap: nowrap;
            justify-content: center;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.85rem;
            border: none;
            /* 按钮边框 */
            border-radius: 6px;
            /* 圆角 */
            cursor: pointer;
            font-weight: 500;
            /* 按钮加粗 */
            transition: 0.2s;
            /* 平滑过渡 */
            white-space: nowrap;
            /* 不换行 */
        }

        .btn-edit {
            background: #e0f2fe;
            color: #0369a1;
        }

        .btn-edit:hover {
            background: #b8e2f8;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        /* 第四部分 页脚 */
        .footer {
            background-color: #808080;
            /* 灰色背景 */
            color: #ffffff;
            /* 白色字体 */
            text-align: center;
            /* 居中对齐 */
            padding: 20px 0;
            margin-top: 30px;
        }

        /* 整体版面居中显示*/
        #container {
            width: 80%;
            margin: 0 auto;
            /*居中显示 */
        }
    </style>
</head>

        <div class="navbar">

        <!-- 第二部分 搜索表单区域 -->
        <form class="search-form" id="searchForm">
            <div class="form-group">

                <input type="text" id="name" name="name" placeholder="请输入姓名" v-model="searchForm.name">
            </div>
            <div class="form-group">
                <label for="gender">性别</label>
                <select id="gender" name="gender" v-model="searchForm.gender">
                    <option value=""></option>
                    <option value="1">男</option>
                    <option value="0">女</option>
                </select>
            </div>
            <div class="form-group">
                <label for="position">职位</label>
                <select id="position" name="position" v-model="searchForm.job">
                    <option value=""></option>
                    <option value="1">班主任</option>
                    <option value="2">讲师</option>
                    <option value="4">学工主管</option>
                    <option value="3">教研主任</option>
                    <option value="5">咨询师</option>
                </select>
            </div>
            <div class="button-group">
                <button type="button" class="btn btn-search" v-on:click="search">查询</button>
                <button type="button" class="btn btn-reset" @click="clear">清空</button>
            </div>
        </form>

        <!-- 第三部分 表格展示区 -->
        <table>
            <thead>

                    <th>最后操作时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(e,index) in empList":key="e.id">
                    <td>{{index+1}}</td>
                    <td>{{e.name}}</td>
                    <td>{{e.gender == 1 ? '男' : '女'}}</td>
                    <!-- 插值表达式不能出现在标签内 -->
                    <td><img class="avatar" v-bind:src="e.image" :alt="e.name"></td>
                    <td>
                        <span v-if="e.job == 1">班主任</span>
                        <span v-else-if="e.job == 2">讲师</span>
                        <span v-else-if="e.job == 4">学工主管</span>
                        <span v-else-if="e.job == 3">教研主任</span>
                        <span v-else-if="e.job == 5">咨询师</span>
                    </td>
                    <td>{{e.entrydate}}</td>
                    <td>{{e.updatetime}}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-sm btn-edit">编辑</button>
                            <button class="btn-sm btn-delete">删除</button>
                        </div>
                    </td>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module">
        import {createApp} from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            data(){
                return {
                    searchForm:{  //封装用户输入的查询条件
                        name:'',
                        gender:'',
                        job:''
                    },
                    empList:[]
                }
            },

            //钩子函数
            mounted(){
                //当页面加载完成后，立即执行这个方法
                this.search()
            },

            //方法
            methods:{
                async search(){

                    //发送异步请求，获取数据
                    // axios.get(`https://web-server.itheima.net/emps/list?name=${this.searchForm.name}&gender=${this.searchForm.gender}&job=${this.searchForm.job}`)
                    // .then(response => {
                    //     this.empList = response.data.data;
                    // })

                    let result= await axios.get(`https://web-server.itheima.net/emps/list?name=${this.searchForm.name}&gender=${this.searchForm.gender}&job=${this.searchForm.job}`)
                    this.empList = result.data.data;
                },
                clear(){
                    //清空
                    this.searchForm = {
                        name:'',
                        gender:'',
                        job:''
                    }
                    this.search()
                }
            }
        }).mount('#container')


        //为表格数据行添加时间监听,鼠标进入背景色#f2e2e2 鼠标离开背景色#ffffff
        //1.获取所有tr
        var trs = document.querySelectorAll("tbody tr");
        //2.遍历所有tr
        for (var i = 0; i < trs.length; i++) {
            trs[i].addEventListener("mouseenter", function () { //鼠标进入
                this.style.backgroundColor = "#f2e2e2";
            });
            trs[i].addEventListener("mouseleave", function () { //鼠标离开
                this.style.backgroundColor = "#ffffff";
            });
        }
    </script>
